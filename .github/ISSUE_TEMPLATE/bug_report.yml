name: Bug report
description: Report a reproducible Koshora defect
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Koshora. Do not include passwords, secret keys, or real private financial data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Landing page
        - Recruiter demo
        - Authentication
        - Private workspace
        - Transactions
        - Budgets
        - Goals
        - Insights
        - Accounts
        - Database / RLS
        - Deployment / CI
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / device
      placeholder: Chrome 151 on Windows 11
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove private data before attaching anything.
