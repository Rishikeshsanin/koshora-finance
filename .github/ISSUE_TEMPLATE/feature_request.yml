name: Feature request
description: Suggest a focused improvement to Koshora
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Demo experience
        - Authentication / onboarding
        - Transactions
        - Budgets
        - Goals
        - Insights / forecasting
        - Accounts
        - Accessibility / responsive UI
        - Developer experience
        - Other
  - type: textarea
    id: boundary
    attributes:
      label: Data / Project Hub impact
      description: If this needs database work, explain why it can stay entirely inside `koshora.*`.
